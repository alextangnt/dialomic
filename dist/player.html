<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Dialomic Player</title>
    <!-- p5/openprocessing scripts removed: not used and can interfere with pointer events -->
    <script type="module" crossorigin src="/assets/player-Rmb2J05n.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/style-BmkZLYPN.js">
    <link rel="modulepreload" crossorigin href="/assets/passageText-aDgBGUSA.js">
    <link rel="stylesheet" crossorigin href="/assets/style-BqwUSyGN.css">
    <link rel="stylesheet" crossorigin href="/assets/landing-B5kbyE_k.css">
  </head>
  <body>
    <div class="background-element" id="paper-bg"></div>
    <iframe id="logicEngine" src="about:blank"></iframe>
    <div id="topbar">
      <div id="playerTitle"><a id="playerHomeLink" class="landing-brand-link" href="./index.html">Dialomic</a> Player</div>
      <div id="storyActions">
        <select id="defaultStorySelect" title="Default story"></select>
        <a id="editorLink" href="./visual-editor.html">✎ Edit Story</a>
      </div>
    </div>
    <footer id="playerStatusBar"></footer>
    <div id="newCustomStoryDialog" class="player-dialog-backdrop" hidden>
      <div class="player-dialog-card">
        <h3>Create Custom Story</h3>
        <p>Template stories must be copied before editing.</p>
        <label for="newCustomStoryName">Story name</label>
        <input id="newCustomStoryName" type="text" maxlength="120">
        <div class="player-dialog-actions">
          <button id="newCustomStoryCancelBtn" type="button">Cancel</button>
          <button id="newCustomStoryCreateBtn" type="button">Create</button>
        </div>
      </div>
    </div>
  </body>
</html>
